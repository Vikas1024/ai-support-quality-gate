name: Quality release gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    name: Required quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Playwright browser and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Formatting check
        run: npm run format:check
      - name: TypeScript type check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Complete release-blocking test suite
        run: npm test
      - name: Upload HTML reports and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-evidence-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14
